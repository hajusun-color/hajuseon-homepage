# 하주선퍼스널컬러교육원 소식 글쓰기 설정 (Sveltia CMS)

backend:
  name: github
  # GitHub 아이디/저장소 이름
  repo: hajusun-color/hajusun-color.github.io
  branch: main

# 저장소 맨 위에 홈페이지 파일(index.html 등)이 바로 있는 구조입니다.
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: posts
    label: 소식
    label_singular: 소식 글
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 작성일, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: 분류
        name: category
        widget: select
        options: [소식, 안내, 정보, 후기]
        default: 소식
      - { label: 요약, name: summary, widget: text, hint: "목록과 검색 결과에 보이는 한두 문장 (80자 안팎)" }
      - { label: 대표이미지, name: image, widget: image, required: false }
      - { label: 임시저장 (체크하면 홈페이지에 안 보임), name: draft, widget: boolean, default: false }
      - { label: 본문, name: body, widget: markdown }
